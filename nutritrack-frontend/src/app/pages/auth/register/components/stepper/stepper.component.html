<div class="d-flex mb-5">

  <div *ngFor="let step of [].constructor(totalSteps); let i = index" class="progress w-25 me-2">
    <div class="progress-bar bg-primary" role="progressbar" [style.width]="(i < currentStep ? 100 : 0) + '%'"
         aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
  </div>
</div>
